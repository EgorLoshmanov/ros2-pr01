name: PR07 — Gazebo bridge and odometry

on:
  push:
    branches: [pr07]
  pull_request:
    branches: [pr07]

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
      options: --user 0
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w07-9b7fdd5424d3.tar.gz
      COURSE_KIT_SHA256: 9b7fdd5424d3d97e47d51dbe23064934585e62135dc2902844dd679529bda929
    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install simulation dependencies
        shell: bash
        run: |
          apt-get update
          apt-get upgrade -y --with-new-pkgs
          apt-get install -y ros-lyrical-ackermann-msgs ros-lyrical-ros-gz
          source /opt/ros/lyrical/setup.bash
          python3 - <<'PY'
          from ackermann_msgs.msg import AckermannDriveStamped
          from rclpy.serialization import serialize_message
          serialize_message(AckermannDriveStamped())
          PY
      - name: Build and test ROS packages
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --packages-up-to course_simulation
          source install/setup.bash
          python3 -m pytest src/course_description/test src/course_simulation/test -q
          colcon test --packages-select course_description course_simulation
          colcon test-result --verbose
      - name: Get pinned course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
          test "$(cat .course-kit/v1/VERSION)" = v1-w07
      - name: Check PR07 evidence
        shell: bash
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR07 --submission .
